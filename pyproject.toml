[project]
name = "mnist-experiments-xyzh"
version = "0.1.0"
description = "MNIST experiment checkouts in one environment: autoencoder, VAE, GAN, RealNVP, and progressive GAN."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "attrs>=25.1",
    "dvc[s3]>=3.59",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "optuna>=4.0",
    "pandas>=2.2",
    "pandera>=0.36.0",
    "plotly>=7.1.0",
    "pyarrow>=17",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "scikit-learn>=1.6",
    "tensordict>=0.15.6",
    "torch>=2.5",
    "torchvision>=0.20",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/mnist_contracts",
  "src/mnist_ae_compression",
  "src/mnist_ae_sompression",
  "src/mnist_betta_vae",
  "src/mnist_f_vae",
  "src/mnist_gan_comparison",
  "src/mnist_gan_extensions",
  "src/mnist_pg_gan",
  "src/mnist_realnvp",
  "src/mnist_vae_comparison",
]
