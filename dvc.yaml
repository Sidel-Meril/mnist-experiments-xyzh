stages:
  # mnist_ae_compression
  mnist_ae_compression_get_data:
    cmd: >
      uv run python src/mnist_ae_compression/01_get_data.py
      --sql src/mnist_ae_compression/queries/images.sql
      --out data/mnist_ae_compression/raw_images.parquet
      --images data/mnist_ae_compression/raw_images.npy
    deps:
      - src/mnist_ae_compression/01_get_data.py
      - src/mnist_ae_compression/queries/images.sql
      - src/mnist_ae_compression/config.py
    outs:
      - data/mnist_ae_compression/raw_images.parquet
      - data/mnist_ae_compression/raw_images.npy

  mnist_ae_compression_engineer:
    cmd: >
      uv run python src/mnist_ae_compression/02_engineer.py
      --raw data/mnist_ae_compression/raw_images.parquet
      --images data/mnist_ae_compression/raw_images.npy
      --out data/mnist_ae_compression/images.parquet
      --pixels data/mnist_ae_compression/pixels.npy
    deps:
      - src/mnist_ae_compression/02_engineer.py
      - src/mnist_contracts/data_contract.py
      - src/mnist_ae_compression/data_contract.yaml
      - src/mnist_contracts/model_contract.py
      - src/mnist_ae_compression/model_contract.yaml
      - data/mnist_ae_compression/raw_images.parquet
      - data/mnist_ae_compression/raw_images.npy
    outs:
      - data/mnist_ae_compression/images.parquet
      - data/mnist_ae_compression/pixels.npy

  mnist_ae_compression_split:
    cmd: >
      uv run python src/mnist_ae_compression/03_split.py
      --data data/mnist_ae_compression/images.parquet
      --out data/mnist_ae_compression/split.json
    deps:
      - src/mnist_ae_compression/03_split.py
      - src/mnist_contracts/model_contract.py
      - src/mnist_ae_compression/model_contract.yaml
      - data/mnist_ae_compression/images.parquet
    outs:
      - data/mnist_ae_compression/split.json

  mnist_ae_compression_tune:
    cmd: >
      uv run python src/mnist_ae_compression/04_tune.py
      --data data/mnist_ae_compression/images.parquet
      --pixels data/mnist_ae_compression/pixels.npy
      --split data/mnist_ae_compression/split.json
      --out reports/mnist_ae_compression/best_params.json
      --storage reports/mnist_ae_compression/mnist_ae.db
      --history reports/mnist_ae_compression/plots/optimization_history.html
      --importances reports/mnist_ae_compression/plots/param_importances.html
      --parallel reports/mnist_ae_compression/plots/parallel_coordinate.html
      --slice reports/mnist_ae_compression/plots/parameter_slice.html
      --latent-curve reports/mnist_ae_compression/plots/reconstruction_error_vs_latent.png
    deps:
      - src/mnist_ae_compression/04_tune.py
      - src/mnist_ae_compression/model.py
      - src/mnist_contracts/model_contract.py
      - src/mnist_ae_compression/model_contract.yaml
      - data/mnist_ae_compression/images.parquet
      - data/mnist_ae_compression/pixels.npy
      - data/mnist_ae_compression/split.json
    outs:
      - reports/mnist_ae_compression/best_params.json
      - reports/mnist_ae_compression/mnist_ae.db
      - reports/mnist_ae_compression/plots/optimization_history.html
      - reports/mnist_ae_compression/plots/param_importances.html
      - reports/mnist_ae_compression/plots/parallel_coordinate.html
      - reports/mnist_ae_compression/plots/parameter_slice.html
      - reports/mnist_ae_compression/plots/reconstruction_error_vs_latent.png

  mnist_ae_compression_train:
    cmd: >
      uv run python src/mnist_ae_compression/05_train.py
      --data data/mnist_ae_compression/images.parquet
      --pixels data/mnist_ae_compression/pixels.npy
      --split data/mnist_ae_compression/split.json
      --params reports/mnist_ae_compression/best_params.json
      --model models/mnist_ae_compression/mnist_ae.pt
      --plot reports/mnist_ae_compression/plots/loss.png
      --reconstructions reports/mnist_ae_compression/reconstructions
    deps:
      - src/mnist_ae_compression/05_train.py
      - src/mnist_ae_compression/model.py
      - src/mnist_contracts/model_contract.py
      - src/mnist_ae_compression/model_contract.yaml
      - data/mnist_ae_compression/images.parquet
      - data/mnist_ae_compression/pixels.npy
      - data/mnist_ae_compression/split.json
      - reports/mnist_ae_compression/best_params.json
    outs:
      - models/mnist_ae_compression/mnist_ae.pt
      - reports/mnist_ae_compression/plots/loss.png
      - reports/mnist_ae_compression/reconstructions

  mnist_ae_compression_eval:
    cmd: >
      uv run python src/mnist_ae_compression/06_eval.py
      --data data/mnist_ae_compression/images.parquet
      --pixels data/mnist_ae_compression/pixels.npy
      --split data/mnist_ae_compression/split.json
      --model models/mnist_ae_compression/mnist_ae.pt
      --train-metrics reports/mnist_ae_compression/evaluation_train.json
      --test-metrics reports/mnist_ae_compression/evaluation_test.json
      --reconstructions-train reports/mnist_ae_compression/plots/reconstructions_train.png
      --reconstructions-test reports/mnist_ae_compression/plots/reconstructions_test.png
    deps:
      - src/mnist_ae_compression/06_eval.py
      - src/mnist_ae_compression/model.py
      - src/mnist_contracts/model_contract.py
      - src/mnist_ae_compression/model_contract.yaml
      - data/mnist_ae_compression/images.parquet
      - data/mnist_ae_compression/pixels.npy
      - data/mnist_ae_compression/split.json
      - models/mnist_ae_compression/mnist_ae.pt
    outs:
      - reports/mnist_ae_compression/evaluation_train.json
      - reports/mnist_ae_compression/evaluation_test.json
      - reports/mnist_ae_compression/plots/reconstructions_train.png
      - reports/mnist_ae_compression/plots/reconstructions_test.png

